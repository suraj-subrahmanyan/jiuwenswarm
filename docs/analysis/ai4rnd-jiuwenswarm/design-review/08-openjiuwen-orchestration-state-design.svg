<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1540" viewBox="0 0 1100 1540" font-family="Helvetica,Arial,'Segoe UI',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">OpenJiuwen — Orchestration and State Design</title><desc id="desc">Four orchestration mechanisms compose common execution resources but use different schedulers and durability models</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>.title{font-size:24px;font-weight:700;fill:#0f172a}.h{font-size:15px;font-weight:700;fill:#1e293b}.n{font-size:12.5px;font-weight:700;fill:#1e293b}.s{font-size:10.5px;fill:#475569}.m{font-size:11px;fill:#64748b}.tiny{font-size:9.5px;fill:#64748b}.tag{font-size:10px;font-weight:700;fill:#475569;letter-spacing:.04em}.flow{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#arr)}.flow2{stroke:#475569;stroke-width:1.7;fill:none;marker-start:url(#arr);marker-end:url(#arr)}.dash{stroke:#64748b;stroke-width:1.3;stroke-dasharray:5 4;fill:none;marker-end:url(#arr)}.box{fill:#fff;stroke:#64748b;stroke-width:1;rx:7}</style><rect width="1100" height="1540" fill="#fff"/>
<text x="24" y="38" class="title">OpenJiuwen — Orchestration and State Design</text>
<text x="24" y="62" class="m">Four orchestration mechanisms compose common execution resources but use different schedulers and durability models</text>
<rect x="30" y="90" width="1040" height="150" rx="10" fill="#e8eef7" stroke="#7d97b8" stroke-width="1.2"/>
<text x="44" y="114" class="h">Execution request before mechanism choice</text>
<text x="44" y="133" class="m">A caller supplies a bounded objective or topology; OpenJiuwen does not infer AI4RnD evidence obligations</text>
<rect x="50" y="145" width="230" height="70" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="61" y="167" class="n">Objective / inputs</text>
<text x="61" y="185" class="s">messages · typed args · files</text>
<rect x="300" y="145" width="230" height="70" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="311" y="167" class="n">Execution policy</text>
<text x="311" y="185" class="s">budget · timeout · isolation</text>
<rect x="550" y="145" width="230" height="70" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="561" y="167" class="n">Available resources</text>
<text x="561" y="185" class="s">models · tools · members</text>
<rect x="800" y="145" width="230" height="70" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="811" y="167" class="n">Mechanism selector</text>
<text x="811" y="185" class="s">agent · workflow · flow · team</text>
<path d="M280 180 H295" class="flow"/>
<path d="M530 180 H545" class="flow"/>
<path d="M780 180 H795" class="flow"/>
<rect x="30" y="285" width="1040" height="225" rx="10" fill="#f3eee4" stroke="#b3a689" stroke-width="1.2"/>
<text x="44" y="309" class="h">1. Direct DeepAgent</text>
<text x="44" y="328" class="m">Adaptive task when topology is unknown locally</text>
<rect x="50" y="360" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="61" y="382" class="n">Control</text>
<text x="61" y="400" class="s">Task-loop coordinator</text>
<rect x="300" y="360" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="311" y="382" class="n">Work unit</text>
<text x="311" y="400" class="s">model ↔ ability ReAct iterations</text>
<rect x="550" y="360" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="561" y="382" class="n">Durability</text>
<text x="561" y="400" class="s">session history + interrupts</text>
<rect x="800" y="360" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="811" y="382" class="n">Returns</text>
<text x="811" y="400" class="s">final message · tool artifacts</text>
<path d="M280 410 H295" class="flow"/>
<path d="M530 410 H545" class="flow"/>
<path d="M780 410 H795" class="flow"/>
<rect x="30" y="555" width="1040" height="225" rx="10" fill="#e9f2ec" stroke="#84a98c" stroke-width="1.2"/>
<text x="44" y="579" class="h">2. Core Workflow / Pregel</text>
<text x="44" y="598" class="m">Known component topology and deterministic/conditional routing</text>
<rect x="50" y="630" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="61" y="652" class="n">Control</text>
<text x="61" y="670" class="s">Pregel superstep scheduler</text>
<rect x="300" y="630" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="311" y="652" class="n">Work unit</text>
<text x="311" y="670" class="s">components read/write typed channels</text>
<rect x="550" y="630" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="561" y="652" class="n">Durability</text>
<text x="561" y="670" class="s">checkpointer snapshots</text>
<rect x="800" y="630" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="811" y="652" class="n">Returns</text>
<text x="811" y="670" class="s">graph outputs · interrupt state</text>
<text x="811" y="686" class="s">router receives no state argument</text>
<path d="M280 680 H295" class="flow"/>
<path d="M530 680 H545" class="flow"/>
<path d="M780 680 H795" class="flow"/>
<rect x="30" y="825" width="1040" height="225" rx="10" fill="#e8eef7" stroke="#7d97b8" stroke-width="1.2"/>
<text x="44" y="849" class="h">3. SwarmFlow [FENCE]</text>
<text x="44" y="868" class="m">Script-defined parallel, pipeline, map and nested phases</text>
<rect x="50" y="900" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="61" y="922" class="n">Control</text>
<text x="61" y="940" class="s">Python flow interpreter + admission</text>
<rect x="300" y="900" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="311" y="922" class="n">Work unit</text>
<text x="311" y="940" class="s">agent sessions / backend calls</text>
<rect x="550" y="900" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="561" y="922" class="n">Durability</text>
<text x="561" y="940" class="s">journal/WAL + progress events</text>
<text x="561" y="956" class="s">resume is engine-API-only</text>
<rect x="800" y="900" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="811" y="922" class="n">Returns</text>
<text x="811" y="940" class="s">script return · phase/run events</text>
<text x="811" y="956" class="s">failed step may yield empty success</text>
<path d="M280 950 H295" class="flow"/>
<path d="M530 950 H545" class="flow"/>
<path d="M780 950 H795" class="flow"/>
<rect x="30" y="1095" width="1040" height="225" rx="10" fill="#f3edf8" stroke="#9873bb" stroke-width="1.2"/>
<text x="44" y="1119" class="h">4. Dynamic Team / NativeHarness</text>
<text x="44" y="1138" class="m">Open-ended coordination with delegation and independent review</text>
<rect x="50" y="1170" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="61" y="1192" class="n">Control</text>
<text x="61" y="1210" class="s">Leader + persistent task scheduler</text>
<rect x="300" y="1170" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="311" y="1192" class="n">Work unit</text>
<text x="311" y="1210" class="s">members · assignees · reviewers</text>
<text x="311" y="1226" class="s">human/bridge roles available</text>
<rect x="550" y="1170" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="561" y="1192" class="n">Durability</text>
<text x="561" y="1210" class="s">team task DB + member/worktree state</text>
<rect x="800" y="1170" width="230" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="811" y="1192" class="n">Returns</text>
<text x="811" y="1210" class="s">task results · review · team stream</text>
<path d="M280 1220 H295" class="flow"/>
<path d="M530 1220 H545" class="flow"/>
<path d="M780 1220 H795" class="flow"/>
<rect x="30" y="1380" width="1040" height="105" rx="10" fill="#fff8e7" stroke="#c3a158" stroke-width="1.2"/>
<text x="44" y="1404" class="h">Common lower-level resources</text>
<text x="44" y="1423" class="m">All four ultimately consume model pools, AbilityManager/runners, Rails, skills, workspace/SysOperation, permissions and memory</text>
<text x="50" y="1450" class="s">Design rule for AI4RnD: compile a ready semantic slice into one mechanism; persist the mapping between project node/attempt and the mechanism&#x27;s native run/checkpoint identifiers.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1750" viewBox="0 0 1100 1750" font-family="Helvetica,Arial,'Segoe UI',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">AI4RnD — Planning, Binding and Execution Design</title><desc id="desc">White-box current control flow with retained product semantics and the tmux carrier marked for replacement</desc>

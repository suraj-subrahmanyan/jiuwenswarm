# Initial proposal — Capability Capsule v2
#
# Design rule:
#   A Capsule is a governed, reusable capability blueprint created before a
#   project is planned. The Planner selects it and expands its ordered steps
#   into the project TaskGraph. Every step names one Logical Operator; skills,
#   MCP and tool capabilities are replaceable requirements or bindings beneath
#   that action. Runtime executor selection is a later, fail-closed decision in
#   the Physical Operator registry.

schema_version: ai4rnd.capability-capsule.v2
# Prefix-to-kind rule: cap.* = capability, guard.* = guard, resource.* = resource.
# Legacy adapter.* IDs remain capability-kind until explicitly migrated below;
# "adapter" is not a fourth capsule_kind.
capability_capsule_id: cap.<domain>-<capability>
capsule_kind: capability            # capability | guard | resource
version: 0.1.0

metadata:
  name: <human-readable name>
  description: <one-sentence capability promise>
  owner: <team-or-person>
  tags: []

portability:
  scope: universal                 # reusable across projects, agents and teams
  executor_agnostic: true
  requires_specific_agent_id: false
  environment_requirements: []

applicability:
  task_types: []
  positive_signals: []
  negative_signals: []
  exclusions: []

contract:
  inputs:
    required:
      - name: <input-name>
        schema_ref: schema://<input-schema>@<version>
        description: <meaning>
    optional: []
  outputs:
    required:
      - name: <output-name>
        schema_ref: schema://<output-schema>@<version>
        description: <meaning>
    optional: []
  preconditions:
    - id: <precondition-id>
      assertion: <machine-checkable or reviewable condition>
  postconditions:
    - id: <postcondition-id>
      assertion: <machine-checkable or reviewable condition>
  invariants:
    - <condition that must remain true throughout execution>

composition:
  consumes: []                      # typed artifact/schema references
  produces: []                      # typed artifact/schema references
  compatible_with: []               # Capsule IDs
  incompatible_with: []             # Capsule IDs
  requires_before: []                # Capsule IDs
  requires_after: []                 # Capsule IDs
  required_guard_capsules: []        # guard.* Capsule IDs
  required_resource_capsules: []     # resource.* Capsule IDs

planning_blueprint:
  # TARGET-ONLY: v1 Capsules contain no plan structure. The Planner instantiates
  # this reusable partial graph inside the project plan.
  expansion: planner_expands_into_taskgraph
  steps:
    - step_id: <stable-local-step-id>
      purpose: <what this step establishes>
      logical_operator_ref: logical-operator://<operator-type>@<version>
      skill_requirements:
        required:
          - skill://<skill-name>@<version>
        optional: []
      consumes:
        - schema://<input-artifact>@<version>
      produces:
        - schema://<output-artifact>@<version>
      depends_on: []
      tool_capability_requirements: []  # capabilities, not concrete tool instances
      mcp_capability_requirements: []   # capabilities, not server credentials
      completion_checks:
        - <observable pass condition>
    - step_id: <dependent-step-id>
      purpose: <what becomes possible after the prior step>
      logical_operator_ref: logical-operator://<operator-type>@<version>
      skill_requirements:
        required:
          - skill://<skill-name>@<version>
        optional: []
      consumes:
        - schema://<output-artifact>@<version>
      produces:
        - schema://<next-artifact>@<version>
      depends_on:
        - <stable-local-step-id>
      tool_capability_requirements: []
      mcp_capability_requirements: []
      completion_checks:
        - <observable pass condition>
  ordering_constraints:
    - before: <stable-local-step-id>
      after: <dependent-step-id>
      reason: <why the dependency is mandatory>
  planner_policy:
    may_skip_optional_steps: true
    may_add_project_specific_steps: true
    may_remove_required_steps: false
    may_relax_contract: false

effects:
  read:
    scopes: []
  write:
    scopes: []
  execute:
    classes: []
  network:
    destinations: []
  cost:
    budget_class: <low|medium|high|custom>
    hard_limit_ref: policy://<budget-policy>
  risk:
    class: <low|medium|high|critical>
    policy_refs: []

executor_policy:
  # Applied after planning: the binder resolves a Physical Operator separately.
  selection: fail_closed             # fail_closed | require_human
  physical_operator_registry_ref: registry://physical-operators/current
  permitted_operator_kinds: []       # e.g. deep_agent, team, tool, workflow
  forbidden_operator_kinds: []
  forbidden_physical_operator_ids: [] # explicit safety deny-list; not identity pinning
  required_capabilities: []
  model_requirements: []              # target: capabilities/constraints, not model IDs
  separation_of_duties:
    writer_may_verify: false
    verifier_must_be_independent: true
  bind_at: runtime
  pin_binding_for_attempt: true
  forbid_identity_pinning: true      # no permanent preferred agent/team/model instance ID

resources:
  # Skills are the main Capsule ingredients. Tools/MCP are typed dependencies.
  skills:
    required: []
    optional: []
  mcp_capabilities: []
  data_refs: []
  secret_refs: []                    # secret:// references only; never values

policy_invariants:
  - id: secret_refs_require_guard_capsule
    assertion: resources.secret_refs is empty or composition.required_guard_capsules contains a guard.* Capsule
    enforcement: schema_semantics_and_runtime_admission
    failure: reject_capsule_or_binding
  - id: no_silent_executor_or_model_fallback
    assertion: selected executor and model satisfy the recorded BindingDecision exactly
    enforcement: binding_and_receipt_validation
    failure: stall_or_reject_attempt
  - id: operator_deny_list_precedes_scoring
    assertion: forbidden operator kinds and ids are removed before candidate ranking
    enforcement: binding_admission
    failure: reject_candidate

verification:
  self_checks:
    - id: <self-check-id>
      method: <test|schema|rule|metric>
      pass_condition: <condition>
  external_verifier:
    required: true
    capability_requirements: []
  acceptance:
    all_of: []
    any_of: []
  evidence_requirements:
    artifact_receipt: true
    execution_receipt: true
    provenance: true
    evaluation_record: true

provenance:
  origin: <human|repository|generated|derived>
  source_refs: []
  created_by: <actor-id>
  created_at: <RFC3339 timestamp>

registry_status:
  # Definition lifecycle only. It does not claim runtime or assurance readiness.
  value: draft                      # draft | candidate | stable | deprecated | retired
  reason: <why this state is justified>

runtime_status_ref:
  # Mutable status is external to this versioned manifest and keyed by Capsule version.
  uri: status://capsules/<capsule-id>@<version>
  required_fields:
    - binding                         # unbound | bound | unavailable
    - readiness                       # not_proven | runnable | integrated | degraded
    - last_probe_ref

assurance_status:
  # Certification is evidence-backed and independent from registry_status.
  value: unassessed                 # unassessed | tested | verified | certified | revoked
  policy_ref: policy://capsule-certification/v1
  evidence_refs: []
  approved_by: null
  approved_at: null

lifecycle:
  in_flight_version_policy: pin
  supersedes: null
  replaced_by: null
  promotion_policy_ref: policy://capsule-promotion/v1
  rollback_policy_ref: policy://capsule-rollback/v1

history_refs:
  change_ledger: ledger://capsules/<capsule-id>/changes
  evaluation_ledger: ledger://capsules/<capsule-id>/evaluations
  performance_ledger: ledger://capsules/<capsule-id>/performance

evolution:
  enabled: false
  allowed_surfaces: []              # prompt, routing, contract, evaluator, etc.
  candidate_generator: null          # e.g. gepa://text-artifact
  frozen_policy_refs: []
  evaluation_suite_refs: []
  promotion_requires_human: true
  rollback_on_regression: true

migration_from_v1:
  # Current registry.default_operator_profile is a preference, not Capsule identity.
  # Migrate it into the Physical Operator registry as a capability-scoped preference;
  # never copy it into the Capsule as a permanent executor or model binding.
  default_operator_profile:
    treatment: preference_only
    target: registry://physical-operators/capability-preferences
    binding_rule: requalify_and_pin_each_attempt
    remove_after_migration: true
  manifests_without_version:
    treatment: backfill_from_registry_or_reject
  runtime_preferences:
    treatment: translate_to_executor_and_model_requirements_or_reject
  legacy_adapter_manifests:
    observed_unregistered_count: 3
    current_kind: capability
    adapter_is_a_capsule_kind: false
    decision_required: true
    allowed_dispositions:
      - register_as_capability
      - reclassify_as_guard_or_resource
      - retire
    rule: preserve no adapter.* manifest without one recorded disposition
  non_universal_capsules:
    treatment: reclassify_or_retire_explicitly

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1780" viewBox="0 0 1100 1780" font-family="Helvetica,Arial,'Segoe UI',sans-serif" role="img" aria-labelledby="title desc">
<title id="title">OpenJiuwen — DeepAgent Turn Design</title><desc id="desc">White-box request, construction, model, tool, Rail, permission, workspace and state interactions</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>.title{font-size:24px;font-weight:700;fill:#0f172a}.h{font-size:15px;font-weight:700;fill:#1e293b}.n{font-size:12.5px;font-weight:700;fill:#1e293b}.s{font-size:10.5px;fill:#475569}.m{font-size:11px;fill:#64748b}.tiny{font-size:9.5px;fill:#64748b}.tag{font-size:10px;font-weight:700;fill:#475569;letter-spacing:.04em}.flow{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#arr)}.flow2{stroke:#475569;stroke-width:1.7;fill:none;marker-start:url(#arr);marker-end:url(#arr)}.dash{stroke:#64748b;stroke-width:1.3;stroke-dasharray:5 4;fill:none;marker-end:url(#arr)}.box{fill:#fff;stroke:#64748b;stroke-width:1;rx:7}</style><rect width="1100" height="1780" fill="#fff"/>
<text x="24" y="38" class="title">OpenJiuwen — DeepAgent Turn Design</text>
<text x="24" y="62" class="m">White-box request, construction, model, tool, Rail, permission, workspace and state interactions</text>
<rect x="30" y="90" width="1040" height="175" rx="10" fill="#e8eef7" stroke="#7d97b8" stroke-width="1.2"/>
<text x="44" y="114" class="h">A. Request resolution in JiuwenSwarm</text>
<text x="44" y="133" class="m">The application resolves identity and a session-bound runtime before OpenJiuwen begins agent execution</text>
<rect x="50" y="150" width="190" height="90" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="61" y="172" class="n">Channel / client</text>
<text x="61" y="190" class="s">message · command · ACP/A2A</text>
<text x="61" y="206" class="s">user + channel identity</text>
<rect x="260" y="150" width="190" height="90" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="271" y="172" class="n">Gateway routing</text>
<text x="271" y="190" class="s">normalize E2A envelope</text>
<text x="271" y="206" class="s">resolve route + session</text>
<rect x="470" y="150" width="190" height="90" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="481" y="172" class="n">AgentServer</text>
<text x="481" y="190" class="s">select configured agent/team</text>
<text x="481" y="206" class="s">cache · invoke · interrupt</text>
<rect x="680" y="150" width="190" height="90" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="691" y="172" class="n">Agent manager</text>
<text x="691" y="190" class="s">load or rebuild runtime</text>
<text x="691" y="206" class="s">bind session context</text>
<rect x="880" y="150" width="180" height="90" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="891" y="172" class="n">Invocation context</text>
<text x="891" y="190" class="s">request · mode · language</text>
<text x="891" y="206" class="s">workspace · permissions</text>
<path d="M240 195 H255" class="flow"/>
<path d="M450 195 H465" class="flow"/>
<path d="M660 195 H675" class="flow"/>
<path d="M870 195 H885" class="flow"/>
<rect x="30" y="300" width="1040" height="235" rx="10" fill="#e9f2ec" stroke="#84a98c" stroke-width="1.2"/>
<text x="44" y="324" class="h">B. Serializable specification becomes a live agent</text>
<text x="44" y="343" class="m">Construction is explicit; definitions and process-local resources remain separate</text>
<rect x="50" y="365" width="190" height="130" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="61" y="387" class="n">DeepAgentSpec</text>
<text x="61" y="405" class="s">model · prompt · tools · MCP</text>
<text x="61" y="421" class="s">Rails · skills · sub-agents</text>
<text x="61" y="437" class="s">task loop · workspace · policy</text>
<rect x="270" y="365" width="190" height="130" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="281" y="387" class="n">BuildContext</text>
<text x="281" y="405" class="s">provider registries</text>
<text x="281" y="421" class="s">parameter/context resolution</text>
<text x="281" y="437" class="s">cross-process rebuild seed</text>
<rect x="490" y="350" width="210" height="130" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="501" y="372" class="n">Resolved components</text>
<text x="501" y="390" class="s">model pool + allocator</text>
<text x="501" y="406" class="s">Ability cards + resources</text>
<text x="501" y="422" class="s">Rail instances + callbacks</text>
<text x="501" y="438" class="s">Skill/workspace managers</text>
<rect x="730" y="365" width="170" height="130" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="741" y="387" class="n">DeepAgentConfig</text>
<text x="741" y="405" class="s">live model/runner references</text>
<text x="741" y="421" class="s">loop and context policies</text>
<text x="741" y="437" class="s">session-capable config</text>
<rect x="930" y="365" width="130" height="130" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="941" y="387" class="n">DeepAgent</text>
<text x="941" y="405" class="s">outer task coordinator</text>
<text x="941" y="421" class="s">inner ReAct agent</text>
<text x="941" y="437" class="s">interrupt/cancel surface</text>
<path d="M240 430 H265" class="flow"/>
<path d="M460 430 H485" class="flow"/>
<path d="M700 430 H725" class="flow"/>
<path d="M900 430 H925" class="flow"/>
<rect x="30" y="575" width="760" height="870" rx="10" fill="#f3eee4" stroke="#b3a689" stroke-width="1.2"/>
<text x="44" y="599" class="h">C. One invocation — two nested loops</text>
<text x="44" y="618" class="m">The outer task loop owns continuation; the inner ReAct loop owns model/tool interaction</text>
<rect x="70" y="640" width="680" height="72" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="81" y="662" class="n">1 · Invoke</text>
<text x="81" y="680" class="s">InvocationContext enters DeepAgent; before-invoke Rails may add context or reject</text>
<rect x="70" y="742" width="680" height="72" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="81" y="764" class="n">2 · Start task iteration</text>
<text x="81" y="782" class="s">Task-loop budget, cancellation, follow-up and prior session state are checked</text>
<rect x="70" y="844" width="680" height="72" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="81" y="866" class="n">3 · Assemble model context</text>
<text x="81" y="884" class="s">system prompt + history + skill guidance + memory + available ability cards</text>
<rect x="70" y="946" width="680" height="72" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="81" y="968" class="n">4 · Allocate and call model</text>
<text x="81" y="986" class="s">before-model Rails → exact pool allocation → provider client → response/exception Rails</text>
<rect x="70" y="1048" width="680" height="72" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="81" y="1070" class="n">5 · Parse response</text>
<text x="81" y="1088" class="s">text may finish the ReAct turn; tool requests enter the ability path</text>
<rect x="70" y="1150" width="680" height="96" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="81" y="1172" class="n">6 · Authorize and execute each ability</text>
<text x="81" y="1190" class="s">before-tool Rails → argument validation → permission ALLOW/ASK/DENY → resource runner</text>
<text x="81" y="1206" class="s">Tool/MCP/sub-agent/workflow/SysOperation returns ToolMessage or typed exception</text>
<rect x="70" y="1276" width="680" height="72" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="81" y="1298" class="n">7 · Consume observation</text>
<text x="81" y="1316" class="s">after-tool Rails → model observation → after-ReAct-iteration Rails</text>
<rect x="70" y="1378" width="680" height="42" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="81" y="1400" class="n">8 · Decide</text>
<text x="81" y="1418" class="s">continue ReAct · finish task iteration · interrupt · fail</text>
<path d="M410 712 V737" class="flow"/>
<path d="M410 814 V839" class="flow"/>
<path d="M410 916 V941" class="flow"/>
<path d="M410 1018 V1043" class="flow"/>
<path d="M410 1120 V1145" class="flow"/>
<path d="M410 1246 V1271" class="flow"/>
<path d="M410 1348 V1373" class="flow"/>
<path d="M750 1399 H775 V780 H755" class="dash"/>
<text x="680" y="771" class="tiny">next outer task iteration</text>
<path d="M750 1312 H770 V1084 H755" class="dash"/>
<text x="657" y="1077" class="tiny">next ReAct turn</text>
<rect x="820" y="575" width="250" height="430" rx="10" fill="#f3edf8" stroke="#9873bb" stroke-width="1.2"/>
<text x="834" y="599" class="h">D. Rail callback envelope</text>
<text x="834" y="618" class="m">Hooks surrounding both loops</text>
<text x="840" y="640" class="n">Invocation</text>
<text x="840" y="662" class="n">before · after</text>
<text x="840" y="684" class="n"></text>
<text x="840" y="706" class="n">Task iteration</text>
<text x="840" y="728" class="n">before · after</text>
<text x="840" y="750" class="n"></text>
<text x="840" y="772" class="n">ReAct iteration</text>
<text x="840" y="794" class="n">after</text>
<text x="840" y="816" class="n"></text>
<text x="840" y="838" class="n">Model call</text>
<text x="840" y="860" class="n">before · after · exception</text>
<text x="840" y="882" class="n"></text>
<text x="840" y="904" class="n">Tool call</text>
<text x="840" y="926" class="n">before · after · exception</text>
<text x="840" y="944" class="tiny">Possible actions:</text>
<text x="840" y="958" class="tiny">context/ability injection</text>
<text x="840" y="972" class="tiny">approval · interrupt · retry</text>
<text x="840" y="986" class="tiny">force-complete · telemetry</text>
<rect x="820" y="1045" width="250" height="400" rx="10" fill="#fff8e7" stroke="#c3a158" stroke-width="1.2"/>
<text x="834" y="1069" class="h">E. Services used by a turn</text>
<text x="834" y="1088" class="m">Shared contracts used by the loop</text>
<rect x="840" y="1100" width="210" height="56" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="851" y="1122" class="n">Model pool + allocator</text>
<text x="851" y="1140" class="s">entry · capability · client config</text>
<rect x="840" y="1170" width="210" height="56" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="851" y="1192" class="n">AbilityManager + runner</text>
<text x="851" y="1210" class="s">metadata cards · executable resources</text>
<rect x="840" y="1240" width="210" height="56" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="851" y="1262" class="n">Permission engine</text>
<text x="851" y="1280" class="s">allow · ask · deny</text>
<rect x="840" y="1310" width="210" height="56" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="851" y="1332" class="n">Workspace / SysOperation</text>
<text x="851" y="1350" class="s">private · team · worktree · sandbox</text>
<rect x="840" y="1380" width="210" height="56" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="851" y="1402" class="n">Skill + memory managers</text>
<text x="851" y="1420" class="s">prompt guidance · retrieved context</text>
<rect x="30" y="1485" width="1040" height="230" rx="10" fill="#eef6f8" stroke="#73a0aa" stroke-width="1.2"/>
<text x="44" y="1509" class="h">F. State written during and after the turn</text>
<text x="44" y="1528" class="m">Operational state is deliberately split; no store is automatically AI4RnD evidence</text>
<rect x="50" y="1545" width="180" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="61" y="1567" class="n">Session state</text>
<text x="61" y="1585" class="s">messages · interrupts</text>
<text x="61" y="1601" class="s">task-loop continuation</text>
<rect x="250" y="1545" width="180" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="261" y="1567" class="n">Workspace state</text>
<text x="261" y="1585" class="s">files · worktree</text>
<text x="261" y="1601" class="s">team/shared artifacts</text>
<rect x="450" y="1545" width="180" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="461" y="1567" class="n">Execution state</text>
<text x="461" y="1585" class="s">tool/model events</text>
<text x="461" y="1601" class="s">allocation + cost facts</text>
<rect x="650" y="1545" width="180" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="661" y="1567" class="n">Engine checkpoint</text>
<text x="661" y="1585" class="s">graph/workflow snapshot</text>
<text x="661" y="1601" class="s">SwarmFlow journal if used</text>
<rect x="850" y="1545" width="180" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1"/>
<text x="861" y="1567" class="n">Memory state</text>
<text x="861" y="1585" class="s">long-term · coding · team</text>
<text x="861" y="1601" class="s">retrieval indices</text>
<text x="50" y="1684" class="s">AI4RnD integration requirement: convert validated runtime facts into a typed attempt receipt; never treat a final message or checkpoint as a scientific verdict.</text>
</svg>
